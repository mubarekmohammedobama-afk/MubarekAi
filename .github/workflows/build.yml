name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MubarekAI.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: project/MubarekAI
      - uses: actions/upload-artifact@v4
        with:
          name: mubarek-ai-debug-apk
          path: project/MubarekAI/app/build/outputs/apk/debug/*.apk
